<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  html, body { margin:0; height:100%; font:13px -apple-system, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; background:Canvas; color:CanvasText; }
  header { display:flex; align-items:center; gap:6px; padding:8px 10px;
    border-bottom:1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  #url { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:.7; }
  button { border:0; background:transparent; color:inherit; font:inherit; cursor:pointer;
    padding:5px 9px; border-radius:6px; }
  button:hover { background:color-mix(in srgb, CanvasText 12%, transparent); }
  main { flex:1; position:relative; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  #spinner { position:absolute; inset:0; display:grid; place-items:center; opacity:.5; pointer-events:none; }
  #spinner.done { display:none; }
</style>
</head>
<body>
<header>
  <button id="close" title="Close (Esc)">✕</button>
  <span id="url"></span>
  <button id="copy" title="Copy link">Copy</button>
  <button id="open" title="Open in new tab">Open in tab ↗</button>
</header>
<main>
  <div id="spinner">Loading…</div>
  <iframe id="f" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"></iframe>
</main>
<script src="peek.js"></script>
</body>
</html>
